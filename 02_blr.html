<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangalore - Explore the Garden City (Grid View)</title>
    <link rel="icon" href="0favicon/blr.png" type="image/png" />
    <style>
        body {
            background-color: #121212;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            color: #e0e0e0;
        }

        header {
            background: linear-gradient(135deg, #1e1e1e, #2d2d2d);
            text-align: center;
            color: #ff7e8f;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1001;
            padding: 15px 20px;
            border-bottom: 1px solid #333;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            box-sizing: border-box;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-around;
            width: 100%;
            flex-wrap: wrap;
            gap: 12px;
            max-width: 1100px;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
            letter-spacing: 1px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        #searchInput, #sortSelect {
            padding: 7px 14px;
            border-radius: 20px;
            border: 1px solid #444;
            background-color: #1a1a1a;
            color: #ff7e8f;
            outline: none;
            font-size: 13px;
            transition: border-color 0.3s;
        }

        #searchInput {
            width: 170px;
        }

        #searchInput:focus, #sortSelect:focus {
            border-color: #ff7e8f;
        }

        #searchInput::placeholder {
            color: #888;
        }

        .action-btn {
            background-color: #1a1a1a;
            border: 1px solid #444;
            color: #ffb6c1;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .action-btn:hover {
            background-color: #ff7e8f;
            color: #121212;
            border-color: #ff7e8f;
        }

        /* Stats Counter & Progress Bar Wrapper */
        .stats-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .stats-badge {
            background-color: #1a1a1a;
            border: 1px solid #444;
            border-radius: 20px;
            padding: 5px 12px;
            font-size: 12px;
            color: #a7f3d0;
            font-weight: 600;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .stats-badge .count-display {
            display: inline-block;
            text-align: right;
            font-variant-numeric: tabular-nums;
            width: 20px;
            color: #34d399;
        }

        .progress-bar-track {
            width: 110px;
            height: 5px;
            background-color: #2d2d2d;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: #10b981;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Region Filter Pills */
        .region-filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1100px;
        }

        .filter-pill {
            background-color: #1a1a1a;
            border: 1px solid #444;
            color: #aaa;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }

        .filter-pill:hover {
            border-color: #ff7e8f;
            color: #ffb6c1;
        }

        .filter-pill.active {
            background-color: #ff7e8f;
            color: #121212;
            border-color: #ff7e8f;
        }

        footer {
            background-color: #1e1e1e;
            padding: 10px 0;
            text-align: center;
            color: #888;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            border-top: 1px solid #333;
            font-size: 13px;
        }

        footer p {
            margin: 0;
        }

        .main-container {
            max-width: 1100px;
            height: calc(100vh - 195px);
            margin: 110px auto 65px;
            padding: 0 20px;
            overflow-y: auto;
            overflow-x: auto;
        }

        /* Grid View Styles (Cards) */
        #gridViewContainer {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            padding-bottom: 20px;
        }

        .place-card {
            background-color: #1e1e1e;
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, background-color 0.2s;
            border: 1px solid #2d2d2d;
            position: relative;
        }

        .place-card:hover {
            background-color: #262626;
            transform: translateY(-2px);
            box-shadow: 0 4px 14px rgba(0,0,0,0.5);
        }

        .place-card .card-content {
            margin-bottom: 12px;
        }

        .place-card .card-top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 8px;
        }

        .place-card .card-title {
            font-size: 16px;
            font-weight: 600;
            color: #ffb6c1;
            text-decoration: none;
            display: inline-block;
        }

        .place-card .card-title:hover {
            color: #ff7e8f;
            text-decoration: underline;
        }

        .region-tag {
            font-size: 10px;
            background-color: #282828;
            color: #ff7e8f;
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid #444;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .place-card .card-address {
            font-size: 13px;
            color: #9ca3af;
            line-height: 1.4;
        }

        .place-card .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #2d2d2d;
            padding-top: 10px;
            font-size: 12px;
            color: #888;
        }

        .visit-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border: 2px solid #ff7e8f;
            border-radius: 6px;
            background-color: transparent;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            outline: none;
            transition: all 0.2s ease;
        }

        .visit-checkbox:checked {
            background-color: #10b981;
            border-color: #10b981;
        }

        .visit-checkbox:checked::after {
            content: '✔';
            color: #ffffff;
            font-size: 13px;
            font-weight: bold;
        }

        .place-card.visited {
            background-color: #0d231a !important;
            border-color: #059669;
        }

        .place-card.visited .card-title {
            color: #34d399;
        }

        .place-card.visited .card-address {
            color: #4ade80;
        }

        .place-card.visited .region-tag {
            background-color: #064e3b;
            color: #6ee7b7;
            border-color: #059669;
        }

        .place-card.visited .visit-checkbox {
            border-color: #34d399;
        }

        /* Modal Overlays */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: #1e1e1e;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 24px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }

        .modal-content h3 {
            margin-top: 0;
            color: #ff7e8f;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #ccc;
            margin-bottom: 6px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #121212;
            color: #e0e0e0;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: #ff7e8f;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btn {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .modal-btn.cancel {
            background-color: #333;
            color: #ccc;
        }

        .modal-btn.cancel:hover {
            background-color: #444;
        }

        .modal-btn.submit {
            background-color: #ff7e8f;
            color: #121212;
        }

        .modal-btn.submit:hover {
            background-color: #ffb6c1;
        }

        /* Empty State */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            color: #888;
            display: none;
        }

        .empty-state h3 {
            color: #ffb6c1;
            margin-bottom: 8px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #121212;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ff7e8f;
        }
    </style>
</head>

<body>

    <header>
        <div class="header-top">
            <h1>Explore Bangalore</h1>
            <div class="header-controls">
                <input type="text" id="searchInput" oninput="applyFiltersAndSort()" placeholder="Search places..." aria-label="Search places">
                <select id="sortSelect" onchange="applyFiltersAndSort()" aria-label="Sort options">
                    <option value="default">Default Order</option>
                    <option value="name-asc">Name (A-Z)</option>
                    <option value="name-desc">Name (Z-A)</option>
                    <option value="unvisited">Unvisited First</option>
                </select>
                <button type="button" class="action-btn" onclick="openAddModal()">+ Add Place</button>
                <button type="button" class="action-btn" onclick="exportData()">Export</button>
                <button type="button" class="action-btn" onclick="triggerImport()">Import</button>
                <button type="button" class="action-btn" onclick="resetData()">Reset</button>
                <input type="file" id="importFile" style="display: none;" accept=".json" onchange="importData(event)">
                
                <div class="stats-container">
                    <div class="stats-badge">
                        Visited: <span id="visitedCount" class="count-display">0</span>/<span id="totalCount" class="count-display">0</span>
                    </div>
                    <div class="progress-bar-track">
                        <div id="progressBarFill" class="progress-bar-fill"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="region-filters" id="regionFilters">
            <!-- Dynamic region pills generated via JS -->
        </div>
    </header>

    <div class="main-container">
        <div id="gridViewContainer">
            <!-- Populated dynamically via script below -->
            <div id="emptyState" class="empty-state">
                <h3>No destinations found</h3>
                <p>Try tweaking your search term or region filter.</p>
            </div>
        </div>
    </div>

    <!-- Add Place Modal -->
    <div id="addModal" class="modal-overlay">
        <div class="modal-content">
            <h3>Add New Destination</h3>
            <div class="form-group">
                <label for="newPlaceName">Place Name</label>
                <input type="text" id="newPlaceName" placeholder="e.g., HAL Heritage Centre">
            </div>
            <div class="form-group">
                <label for="newPlaceAddress">Full Address / Location</label>
                <textarea id="newPlaceAddress" rows="3" placeholder="e.g., Old Airport Road, Bengaluru, Karnataka"></textarea>
            </div>
            <div class="modal-actions">
                <button type="button" class="modal-btn cancel" onclick="closeAddModal()">Cancel</button>
                <button type="button" class="modal-btn submit" onclick="saveNewPlace()">Save Place</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Explore Bangalore - Custom Edition</p>
    </footer>

    <script>
        const defaultPlacesData = [

            { name: "St. Mary's Basilica", address: "MS Nagar, Shivaji Nagar, Bengaluru, Karnataka 560051" },
            { name: "St. Patrick's Church", address: "155, Brigade Road, Ashok Nagar, Bengaluru, Karnataka 560025" },
            { name: "NGMA", address: "Palace Road, Vasanth Nagar, Bengaluru, Karnataka 560052" },
            { name: "HAL Museum", address: "Old Airport Road, Marathahalli, Bengaluru, Karnataka 560037" },
            { name: "Bangalore Fort", address: "New Tharagupet, Bengaluru, Karnataka 560002" },
            { name: "MG Rd Boulevard", address: "Mahatma Gandhi Road, Ashok Nagar, Bengaluru, Karnataka 560001" },
            { name: "Kempegowda Museum", address: "Mayo Hall, 1st Floor, MG Road, Ashok Nagar, Bengaluru, Karnataka 560001" },
            { name: "Aquarium", address: "Cubbon Park, Kasturba Road, Bengaluru, Karnataka 560001" },
            { name: "Butterfly Park", address: "Bannerghatta Biological Park, Bannerghatta, Bengaluru, Karnataka 560083" },
            { name: "Film City", address: "Binny Mills, Near Magadi Road, Bengaluru, Karnataka 560023" },
            { name: "Biological Park", address: "Bannerghatta Biological Park, Bannerghatta, Bengaluru, Karnataka 560083" },
            { name: "Kanakapura Gallery", address: "Kanakapura Road, Udayapura, Bengaluru, Karnataka 560082" },
            { name: "Rangoli Art Center", address: "Metro Boulevard, MG Road, Ashok Nagar, Bengaluru, Karnataka 560001" },
            { name: "Turf Club", address: "Race Course Road, Gandhi Nagar, Bengaluru, Karnataka 560001" },
            { name: "Lumbini Gardens", address: "Outer Ring Road, Hebbal, Bengaluru, Karnataka 560045" },
            { name: "Golf Club", address: "Sankey Road, High Grounds, Bengaluru, Karnataka 560001" },
            { name: "Chunchi Falls", address: "Kanakapura Taluk, Ramanagara District, Karnataka, 562121" },
            { name: "Sand Sculpture", address: "Innovative Film City, Bidadi, Bengaluru, Karnataka 562109" },
            { name: "Rasta Café", address: "7th Milestone, Bangalore-Mysore Highway, Kenthanahalli, Karnataka 562109" },
            { name: "Neeladri Park", address: "Electronic City Phase 1, Bengaluru, Karnataka 560100" },
            { name: "Freedom Park", address: "Seshadri Road, Attiguppe, Gandhi Nagar, Bengaluru, Karnataka 560009" },
            { name: "Vani Science Park", address: "IISc Campus, Mathikere, Bengaluru, Karnataka 560012" },
            { name: "Skandagiri", address: "Kalavarahalli, Chikkaballapur District, Karnataka, 562101" },
            { name: "Ragi Gudda Temple", address: "9th Jayanagar Block, Jayanagar, Bengaluru, Karnataka 560069" },
            { name: "Kanakapura Art", address: "Kanakapura Main Road, Bengaluru, Karnataka 560082" },
            { name: "Gavi Temple", address: "Gavipuram, Kempegowda Nagar, Bengaluru, Karnataka 560019" },
            { name: "Ulsoor Photowalk", address: "Halasuru Lake Area, Ulsoor, Bengaluru, Karnataka 560008" },
            { name: "Safina Plaza", address: "84-85, Infantry Road, Tasker Town, Shivaji Nagar, Bengaluru, Karnataka 560001" },
            { name: "Wine Tour", address: "Groz Roots / Chennais, Channapatna region, Ramanagara District, Karnataka (Various vineyards around Bangalore rural)" },
            { name: "Sri Guruvayoorappan Temple", address: "1st Main Road, 3rd Block, Nagarbhavi, Bengaluru, Karnataka 560072" },
            { name: "Pyramid Valley International", address: "Harohalli, Kanakapura Road, Bengaluru, Karnataka 562112" },
            { name: "Vasu Hotel", address: "Devaraja Mohalla, Mandi Mohalla, Mysuru, Karnataka 570001 (Famous for Tuppa Dosa)" },
            { name: "Sri Uttaradi Matha", address: "Basavanagudi, Bengaluru, Karnataka 560004" },
            { name: "Vidyarthi Bhavan", address: "32, Gandhi Bazaar Main Road, Basavanagudi, Bengaluru, Karnataka 560004" },
            { name: "Dakshin Delicacy", address: "Residency Road, Shanthala Nagar, Ashok Nagar, Bengaluru, Karnataka 560025" },
            { name: "Guhantara", address: "Kanakapura Road, Kaggalipura, Bengaluru, Karnataka 560082" },
            { name: "Mahogany Glen", address: "Nandi Hills Foothills, Chikkaballapur, Karnataka 562103" },
            { name: "Nesara Centre For Culture", address: "Basavanagudi, Bengaluru, Karnataka 560004" },
            { name: "BLR Brewing Co.", address: "7th Cross Road, Industrial Area, 5th Block, Koramangala, Bengaluru, Karnataka 560095" }
        ];

        let placesData = JSON.parse(localStorage.getItem('customPlacesList')) || defaultPlacesData;
        let selectedRegion = 'All';

        document.addEventListener("DOMContentLoaded", () => {
            buildRegionFilters();
            renderCards();
            updateStats();
        });

        function getRegion(address) {
			let lower = address.toLowerCase();
			if (lower.includes('mandya')) return 'Mandya';
			if (lower.includes('mysuru') || lower.includes('mysore')) return 'Mysore';
			if (lower.includes('ramanagara') || lower.includes('channapatna')) return 'Ramanagara';
			if (lower.includes('chikkaballapur') || lower.includes('nandi')) return 'Chikkaballapur';
			if (lower.includes('kollegal') || lower.includes('chamarajanagar')) return 'Kollegal';
			return 'Bangalore'; 
		}

        function buildRegionFilters() {
			let regions = ['All', 'Bangalore', 'Mandya', 'Mysore', 'Ramanagara', 'Chikkaballapur', 'Kollegal'];
			let container = document.getElementById('regionFilters');
			let html = '';

			regions.forEach(reg => {
				let activeClass = reg === selectedRegion ? 'active' : '';
				html += `<button class="filter-pill ${activeClass}" onclick="setRegion('${reg}')">${reg}</button>`;
			});

			container.innerHTML = html;
		}

        function setRegion(region) {
            selectedRegion = region;
            buildRegionFilters();
            applyFiltersAndSort();
        }

        function renderCards() {
            document.getElementById('totalCount').textContent = placesData.length;
            let gridContainer = document.getElementById('gridViewContainer');
            let visitedData = JSON.parse(localStorage.getItem('visitedPlaces_gridview')) || {};
            let cardsHtml = '';

            placesData.forEach((item, index) => {
                let mapUrl = `https://www.google.com/maps?q=${encodeURIComponent(item.name + ', ' + item.address)}`;
                let isVisited = !!visitedData[item.name.toLowerCase()];
                let region = getRegion(item.address);

                cardsHtml += `
                    <div class="place-card ${isVisited ? 'visited' : ''}" 
                         data-index="${index}" 
                         data-name="${item.name.toLowerCase()}" 
                         data-address="${item.address.toLowerCase()}"
                         data-region="${region}">
                        <div class="card-content">
                            <div class="card-top-row">
                                <a class="card-title" href="${mapUrl}" target="_blank">${item.name}</a>
                                <span class="region-tag">${region}</span>
                            </div>
                            <div class="card-address">${item.address}</div>
                        </div>
                        <div class="card-footer">
                            <span>Visited</span>
                            <input type="checkbox" class="visit-checkbox" ${isVisited ? 'checked' : ''} onchange="updateVisitedState(${index}, this.checked)" title="Mark as visited">
                        </div>
                    </div>
                `;
            });

            cardsHtml += `
                <div id="emptyState" class="empty-state">
                    <h3>No destinations found</h3>
                    <p>Try tweaking your search term or region filter.</p>
                </div>
            `;

            gridContainer.innerHTML = cardsHtml;
            applyFiltersAndSort();
        }

        function updateStats() {
            let visitedData = JSON.parse(localStorage.getItem('visitedPlaces_gridview')) || {};
            let count = Object.keys(visitedData).length;
            let total = placesData.length;
            
            document.getElementById('visitedCount').textContent = count;
            document.getElementById('totalCount').textContent = total;
            let percentage = total > 0 ? Math.round((count / total) * 100) : 0;
            document.getElementById('progressBarFill').style.width = percentage + '%';
        }

        function updateVisitedState(index, isChecked) {
            let visitedData = JSON.parse(localStorage.getItem('visitedPlaces_gridview')) || {};
            let placeName = placesData[index].name.toLowerCase();

            if (isChecked) {
                visitedData[placeName] = true;
            } else {
                delete visitedData[placeName];
            }
            localStorage.setItem('visitedPlaces_gridview', JSON.stringify(visitedData));
            updateStats();

            document.querySelectorAll(`[data-index="${index}"]`).forEach(el => {
                let checkbox = el.querySelector('.visit-checkbox');
                if (isChecked) {
                    el.classList.add('visited');
                    if (checkbox) checkbox.checked = true;
                } else {
                    el.classList.remove('visited');
                    if (checkbox) checkbox.checked = false;
                }
            });
        }

        function applyFiltersAndSort() {
            let searchInput = document.getElementById('searchInput').value.toLowerCase();
            let sortOption = document.getElementById('sortSelect').value;
            let visitedData = JSON.parse(localStorage.getItem('visitedPlaces_gridview')) || {};
            
            let gridContainer = document.getElementById('gridViewContainer');
            let cards = Array.from(gridContainer.getElementsByClassName('place-card'));
            
            let visibleCount = 0;
            cards.forEach(card => {
                let name = card.getAttribute('data-name');
                let address = card.getAttribute('data-address');
                let region = card.getAttribute('data-region');

                let matchesSearch = name.includes(searchInput) || address.includes(searchInput);
                let matchesRegion = (selectedRegion === 'All' || region === selectedRegion);

                if (matchesSearch && matchesRegion) {
                    card.style.display = "";
                    visibleCount++;
                } else {
                    card.style.display = "none";
                }
            });

            cards.sort((a, b) => {
                let idxA = parseInt(a.getAttribute('data-index'));
                let idxB = parseInt(b.getAttribute('data-index'));
                let itemA = placesData[idxA];
                let itemB = placesData[idxB];
                let visitA = !!visitedData[itemA.name.toLowerCase()];
                let visitB = !!visitedData[itemB.name.toLowerCase()];

                if (sortOption === 'name-asc') {
                    return itemA.name.localeCompare(itemB.name);
                } else if (sortOption === 'name-desc') {
                    return itemB.name.localeCompare(itemA.name);
                } else if (sortOption === 'unvisited') {
                    if (visitA !== visitB) return visitA ? 1 : -1;
                    return idxA - idxB;
                } else {
                    return idxA - idxB;
                }
            });

            cards.forEach(card => gridContainer.appendChild(card));

            let emptyState = document.getElementById('emptyState');
            emptyState.style.display = visibleCount === 0 ? "block" : "none";
        }

        /* Modal Handlers */
        function openAddModal() {
            document.getElementById('newPlaceName').value = '';
            document.getElementById('newPlaceAddress').value = '';
            document.getElementById('addModal').style.display = 'flex';
        }

        function closeAddModal() {
            document.getElementById('addModal').style.display = 'none';
        }

        function saveNewPlace() {
            let name = document.getElementById('newPlaceName').value.trim();
            let address = document.getElementById('newPlaceAddress').value.trim();

            if (!name || !address) {
                alert('Please provide both a place name and an address.');
                return;
            }

            placesData.push({ name, address });
            localStorage.setItem('customPlacesList', JSON.stringify(placesData));
            closeAddModal();
            renderCards();
            updateStats();
        }

        /* Export, Import, Reset Functionality */
        function exportData() {
            let exportObj = {
                places: placesData,
                visited: JSON.parse(localStorage.getItem('visitedPlaces_gridview')) || {}
            };
            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObj, null, 2));
            let downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "explore_bangalore_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function triggerImport() {
            document.getElementById('importFile').click();
        }

        function importData(event) {
            let file = event.target.files[0];
            if (!file) return;

            let reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let imported = JSON.parse(e.target.result);
                    if (imported.places && Array.isArray(imported.places)) {
                        placesData = imported.places;
                        localStorage.setItem('customPlacesList', JSON.stringify(placesData));
                        if (imported.visited) {
                            localStorage.setItem('visitedPlaces_gridview', JSON.stringify(imported.visited));
                        }
                        renderCards();
                        updateStats();
                        alert('Data imported successfully!');
                    } else {
                        alert('Invalid backup file format.');
                    }
                } catch (err) {
                    alert('Error parsing JSON file.');
                }
                event.target.value = ''; // Reset file input
            };
            reader.readAsText(file);
        }

        function resetData() {
            if (confirm('Are you sure you want to reset all custom places and visited checks back to default?')) {
                localStorage.removeItem('customPlacesList');
                localStorage.removeItem('visitedPlaces_gridview');
                placesData = [...defaultPlacesData];
                renderCards();
                updateStats();
            }
        }
    </script>

</body>

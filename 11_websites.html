<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Sites</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .sites {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .site-card {
            text-decoration: none;
            color: white;

            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;

            padding: 22px 15px;

            text-align: center;

            transition: all 0.2s ease;
        }

        .site-card:hover {
            transform: translateY(-4px);
            background: #334155;
            border-color: #64748b;
        }

        .icon {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .site-name {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .site-url {
            font-size: 12px;
            color: #94a3b8;
        }

        /* Tablet */
        @media (max-width: 700px) {
            .sites {
                grid-template-columns: repeat(2, 1fr);
            }

            .site-card {
                padding: 18px 10px;
            }
        }

        /* Mobile */
        @media (max-width: 450px) {
            body {
                padding: 12px;
            }

            h1 {
                font-size: 25px;
            }

            .subtitle {
                margin-bottom: 15px;
            }

            .sites {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .site-card {
                padding: 14px 8px;
            }

            .icon {
                font-size: 23px;
            }

            .site-name {
                font-size: 14px;
            }

            .site-url {
                font-size: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🌐 My Sites</h1>
        <p class="subtitle">Choose a website to continue</p>

        <div class="sites">

            <a class="site-card"
               href="https://cinezo.net"
               target="_blank"
               rel="noopener noreferrer">
                <div class="icon">🎬</div>
                <div class="site-name">Cinezo</div>
                <div class="site-url">cinezo.net</div>
            </a>

            <a class="site-card"
               href="https://flickhub.net"
               target="_blank"
               rel="noopener noreferrer">
                <div class="icon">🎥</div>
                <div class="site-name">FlickHub</div>
                <div class="site-url">flickhub.net</div>
            </a>

            <a class="site-card"
               href="https://arrowtv.net"
               target="_blank"
               rel="noopener noreferrer">
                <div class="icon">📺</div>
                <div class="site-name">Arrow TV</div>
                <div class="site-url">arrowtv.net</div>
            </a>

            <a class="site-card"
               href="https://yenime.net"
               target="_blank"
               rel="noopener noreferrer">
                <div class="icon">🍿</div>
                <div class="site-name">Yenime</div>
                <div class="site-url">yenime.net</div>
            </a>

            <a class="site-card"
               href="https://animesalt.ac"
               target="_blank"
               rel="noopener noreferrer">
                <div class="icon">🌸</div>
                <div class="site-name">AnimeSalt</div>
                <div class="site-url">animesalt.ac</div>
            </a>

            <a class="site-card"
               href="https://animeplay.icu"
               target="_blank"
               rel="noopener noreferrer">
                <div class="icon">🎞️</div>
                <div class="site-name">AnimePlay</div>
                <div class="site-url">animeplay.icu</div>
            </a>

            <a class="site-card"
               href="https://watchott.ru"
               target="_blank"
               rel="noopener noreferrer">
                <div class="icon">📱</div>
                <div class="site-name">WatchOTT</div>
                <div class="site-url">watchott.ru</div>
            </a>

            <a class="site-card"
               href="https://nightflix.to"
               target="_blank"
               rel="noopener noreferrer">
                <div class="icon">🌙</div>
                <div class="site-name">NightFlix</div>
                <div class="site-url">nightflix.to</div>
            </a>

            <a class="site-card"
               href="https://cinegram.tv-series/"
               target="_blank"
               rel="noopener noreferrer">
                <div class="icon">📺</div>
                <div class="site-name">Cinegram</div>
                <div class="site-url">cinegram.tv-series</div>
            </a>

        </div>

    </div>

</body>
</html>

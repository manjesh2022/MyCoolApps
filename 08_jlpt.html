<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JLPT Preparation</title>
<link rel="icon" href="https://cdn-icons-png.flaticon.com/128/619/619044.png" type="image/png"/>

<style>
:root {
    --bg-color: #121212;
    --card-bg: #1e1e1e;
    --card-hover: #2d2d2d;
    --text-color: #f0f0f0;
    --accent-green: #00c853;
    --accent-bright: #00e676;
}

body {
    margin: 0;
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 15px;
    box-sizing: border-box;
    overflow: hidden;
}

/* CONTAINER */
.container {
    width: 95%;
    max-width: 1100px;
    max-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 15px;
}

/* SECTION TITLE */
.section-title {
    color: var(--accent-bright);
    font-size: 16px;
    margin: 0 0 8px;
    border-left: 4px solid var(--accent-green);
    padding-left: 8px;
    letter-spacing: 0.5px;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
    gap: 12px;
}

/* CARD */
.card {
    height: 115px;
    background: var(--card-bg);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    padding: 8px;
    box-sizing: border-box;
    box-shadow: 0 3px 6px rgba(0,0,0,0.2);
}

.card:hover {
    background: var(--card-hover);
    transform: translateY(-3px);
    box-shadow: 0 5px 10px rgba(0,200,83,0.15);
}

/* ICON */
.icon {
    font-size: 38px;
    margin-bottom: 6px;
}

/* LINKS */
a {
    color: inherit;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="container">
